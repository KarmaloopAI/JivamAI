name: Update download links

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths-ignore:
      # Ignore commits made by this workflow itself to avoid an infinite loop
      - '_data/downloads.yml'
  workflow_dispatch:

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Tag comes directly from the release event
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # Push / manual run — fetch the latest published release
            TAG=$(gh release list --repo KarmaloopAI/JivamAI --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [[ -z "$TAG" ]]; then
              echo "No published releases found — skipping"
              echo "tag=" >> $GITHUB_OUTPUT
            else
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Write _data/downloads.yml
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/KarmaloopAI/JivamAI/releases/download/${TAG}"

          cat > _data/downloads.yml <<EOF
          version: "${VERSION}"
          release_url: "https://github.com/KarmaloopAI/JivamAI/releases/tag/${TAG}"

          mac:
            dmg: "${BASE}/Jivam-${VERSION}-universal.dmg"
            zip: "${BASE}/Jivam-${VERSION}-universal-mac.zip"
            label: "macOS (Apple Silicon + Intel)"
            note: "Universal binary — works on both Apple Silicon and Intel Macs"

          linux:
            appimage_x64: "${BASE}/Jivam-${VERSION}-x86_64.AppImage"
            appimage_arm64: "${BASE}/Jivam-${VERSION}-arm64.AppImage"
            deb: "${BASE}/jivam_${VERSION}_amd64.deb"
            label: "Linux (x86_64 & ARM64)"
            note: "AppImage runs on any distro. .deb for Debian/Ubuntu."

          windows:
            available: true
            setup: "${BASE}/Jivam-Setup-${VERSION}.exe"
            portable: "${BASE}/Jivam-${VERSION}-portable.exe"
            label: "Windows 10 / 11"
            note: "Installer recommended. Portable .exe requires no installation."
          EOF

      - name: Commit and push
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/downloads.yml
          git diff --cached --quiet && echo "Already up to date" && exit 0
          git commit -m "chore: update download links for ${TAG}"
          git push
